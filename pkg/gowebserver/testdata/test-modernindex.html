<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>/</title>
  <script>
    try {
      var t = localStorage.getItem('gows-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) { }
  </script>
  <link rel="stylesheet" href="./_gows/208be44fd87f3ecb/custom-index.css">
</head>

<body>
  <div class="ambient" id="ambient" aria-hidden="true"><canvas width="192" height="128"></canvas><canvas width="192" height="128"></canvas></div>

  <script src="./_gows/208be44fd87f3ecb/icons.js"></script>

  <div class="page">
    <header class="hero" id="hero">
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <h1 class="title" id="title" data-from-path>/</h1>
      <p class="summary" id="summary"></p>
    </header>

    <div class="toolbar" id="toolbar">
      <span class="tb-title" id="tb-title" aria-hidden="true">/</span>
      <label class="search">
        <span class="sr-only">Filter this folder</span>
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><line x1="16.5" y1="16.5" x2="21" y2="21" /></svg>
        <input id="filter" type="search" placeholder="Filter" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </label>
      <nav class="seg" aria-label="Sort by">
        <a href="?sort=name-desc" aria-current="true">Name<svg><use href="#ui-up" /></svg></a>
        <a href="?sort=date-desc">Date</a>
        <a href="?sort=size-desc">Size</a>
      </nav>
      <button class="icon-btn" id="theme" type="button" aria-label="Theme: automatic">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M12 4a8 8 0 010 16z" fill="currentColor" /></svg>
      </button>
    </div>

    <main>
      
      <section class="files" id="files" aria-label="Folders and files">
        <div class="files-head" aria-hidden="true"><span>Name</span><span class="col-size">Size</span><span class="col-date">Modified</span></div>
        <div class="files-body" id="files-body"></div>
      </section>
      

      

      
      <p class="empty" id="no-match" hidden><strong>No matches</strong>Nothing in this folder matches your filter.</p>
    </main>

    <div class="footer">Go Web Server , </div>
  </div>

  <div class="scrub" id="scrub" aria-hidden="true"><div class="scrub-label" id="scrub-label"></div><div class="scrub-thumb" id="scrub-thumb"></div></div>

  <dialog class="ss" id="ss" aria-label="Slideshow" tabindex="-1">
    
    <div class="ss-frame" id="ss-frame">
      <div class="ss-bg"></div>
      <div class="ss-ambient" id="ss-ambient"><canvas width="192" height="128"></canvas><canvas width="192" height="128"></canvas></div>
      <div class="ss-vignette"></div>
      <div class="ss-stage" id="ss-stage"></div>
      <div class="ss-shade"></div>
      <div class="ss-top">
        <div class="ss-info" aria-live="polite">
          <div class="ss-name" id="ss-name"></div>
          <div class="ss-sub" id="ss-sub"></div>
        </div>
        <button class="ss-btn" id="ss-auto" type="button" aria-label="Play slideshow" aria-pressed="false" data-key="Space"><svg viewBox="0 0 24 24"><polygon class="i-play" points="7 4 19 12 7 20 7 4" /></svg></button>
        <button class="ss-btn opt" id="ss-full" type="button" aria-label="Full screen" data-key="F"><svg viewBox="0 0 24 24"><path class="i-tl" d="M4 9V4h5" /><path class="i-tr" d="M20 9V4h-5" /><path class="i-bl" d="M4 15v5h5" /><path class="i-br" d="M20 15v5h-5" /></svg></button>
        <a class="ss-btn opt" id="ss-open" href="#" target="_blank" rel="noopener" aria-label="Open original"><svg viewBox="0 0 24 24"><path class="i-launch" d="M14 4h6v6M20 4l-9 9" /><path d="M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5" /></svg></a>
        <a class="ss-btn" id="ss-dl" href="#" download aria-label="Download"><svg viewBox="0 0 24 24"><defs><clipPath id="ss-dl-clip"><rect x="0" y="0" width="24" height="23.7" /></clipPath></defs><g clip-path="url(#ss-dl-clip)"><path class="i-drop" d="M12 4v11M7 10l5 5 5-5" /></g><path class="i-gl" d="M5 20h7" /><path class="i-gr" d="M12 20h7" /></svg></a>
        <button class="ss-btn" id="ss-close" type="button" aria-label="Close" data-key="Esc"><svg viewBox="0 0 24 24"><path class="i-x1" d="M6 6l12 12" /><path class="i-x2" d="M18 6L6 18" /></svg></button>
      </div>
      <button class="ss-btn ss-nav ss-prev" id="ss-prev" type="button" aria-label="Previous" data-key="←"><svg viewBox="0 0 24 24"><polyline class="i-back" points="15 18 9 12 15 6" /></svg></button>
      <button class="ss-btn ss-nav ss-next" id="ss-next" type="button" aria-label="Next" data-key="→"><svg viewBox="0 0 24 24"><polyline class="i-fwd" points="9 18 15 12 9 6" /></svg></button>
      <div class="ss-bottom">
        <div class="ss-strip" id="ss-strip" hidden></div>
      </div>
    </div>
  </dialog>

  <script>
    window.GOWS = {
      sort: "name",
      
      
      thumbs:  false ,
      videoThumbs:  false ,
      
      diag: "",
      
      
      
      files: [[2,"ok","ok","folder",0,"0001-01-01"],[2,"abc","abc","folder",0,"0001-01-01"],],
      
      media: []
    };
  </script>
  <script src="./_gows/208be44fd87f3ecb/custom-index.js"></script>
</body>

</html>
