    html {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px;
      overflow-x: hidden;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
      word-break: break-all;
    }

     
    .listing {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 32px;
    }

    .listing-header {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .listing-header .col-name {
      flex: 1;
      min-width: 0;
    }

    .listing-header .col-size {
      width: 80px;
      text-align: right;
    }

    .listing-header .col-modified {
      width: 110px;
      text-align: right;
      padding-left: 12px;
    }

    .sort-link {
      color: var(--text-secondary);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.12s ease;
    }

    .sort-link:hover {
      color: var(--text);
    }

    .sort-arrow {
      font-size: 0.6rem;
      line-height: 1;
    }

    .entry {
      display: flex;
      align-items: center;
      -webkit-user-select: none;
      user-select: none;
    }

    .entry:nth-child(odd) {
      background-color: var(--bg-secondary);
    }

    .entry:hover {
      background-color: var(--hover-bg);
    }

    .entry .icon-link {
      display: flex;
      align-items: center;
      justify-content: center;
      align-self: stretch;
      width: 48px;
      flex-shrink: 0;
      text-decoration: none;
      color: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0.08);
      transition: background-color 0.15s ease;
    }

    .entry .content-link {
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 0;
      padding: 15px 16px 15px 6px;
      text-decoration: none;
      color: var(--text);
      cursor: pointer;
    }

    .entry .col-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--link);
      font-weight: 500;
    }

    .entry .icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .entry .icon-link:hover .icon {
      transform: scale(1.45);
    }

    .entry .icon svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes folder-open {
      0% {
        transform: rotateX(0);
      }

      50% {
        transform: rotateX(-30deg);
      }

      100% {
        transform: rotateX(-15deg);
      }
    }

    .icon-link:hover .icon-folder .folder-flap {
      transform-origin: 3px 7px;
      animation: folder-open 0.5s ease forwards;
    }

     
    @keyframes dl-cycle {
      0%   { transform: translateY(0); }
      58%  { transform: translateY(7px); }
      59%  { transform: translateY(-14px); }
      100% { transform: translateY(0); }
    }

    @keyframes dl-floor-collapse {
      0%   { transform: scaleX(1); opacity: 1; }
      30%  { transform: scaleX(1); opacity: 1; }
      48%  { transform: scaleX(0.55); opacity: 0.35; }
      57%  { transform: scaleX(0.3); opacity: 0.1; }
      59%  { transform: scaleX(1); opacity: 1; }
      100% { transform: scaleX(1); opacity: 1; }
    }

    .icon-link:hover .icon-download .dl-arrow {
      animation: dl-cycle 1.6s linear infinite;
    }

    .icon-link:hover .icon-download .dl-ground {
      transform-origin: 12px 21px;
      animation: dl-floor-collapse 1.6s linear infinite;
    }

     
    @keyframes line-shimmer {
      0% {
        opacity: 0.3;
        stroke-dashoffset: 8;
      }

      100% {
        opacity: 1;
        stroke-dashoffset: 0;
      }
    }

    .icon-link:hover .icon-text .line1 {
      stroke-dasharray: 8;
      animation: line-shimmer 0.4s ease forwards;
    }

    .icon-link:hover .icon-text .line2 {
      stroke-dasharray: 8;
      animation: line-shimmer 0.4s 0.1s ease forwards;
      opacity: 0.3;
    }

     
    @keyframes stamp-press {
      0% {
        transform: scale(1);
      }

      40% {
        transform: scale(0.9);
      }

      100% {
        transform: scale(1.05);
      }
    }

    .icon-link:hover .icon-pdf .pdf-page {
      transform-origin: center;
      animation: stamp-press 0.4s ease forwards;
    }

     
    @keyframes page-curl {

    (function () {
      function formatDuration(seconds) {
        var total = Math.floor(seconds);

        if (!g) return;
        var el;
        if (g.type === 'slide') {
          var atStart = ssIndex <= 0;
          var atEnd = ssIndex >= ssItems.length - 1;
          
          var visualDelta = (atStart && g.dx > 0) || (atEnd && g.dx < 0)
            ? ssRubberBand(g.dx, ssStridePx())
            : g.dx;
          ssTrack.style.transform = 'translate3d(' + (ssTrackX(ssIndex) + visualDelta) + 'px, 0, 0)';
        } else if (g.type === 'dismiss') {
          var item = ssTrack.children[ssIndex];
          if (!item) return;
          var p = Math.min(Math.abs(g.dy) / (window.innerHeight * 0.5), 1);
          item.style.transition = 'none';
          item.style.transform = 'translate3d(0, ' + g.dy + 'px, 0) scale(' + (1 - p * 0.25) + ')';
          ssBackdrop.style.transition = 'none';
          ssBackdrop.style.opacity = String(1 - p * 0.85);
        } else if (g.type === 'pan') {
          el = ssCurrentEl();
          if (!el) return;
          var c = ssClampPan(el, ssZoom, g.panX0 + g.dx, g.panY0 + g.dy);
          ssPanX = c.x;
          ssPanY = c.y;
          ssApplyZoom(false);
        } else if (g.type === 'pinch') {
          var pts = ssPoints();
          if (pts.length < 2) return;
          var m = ssMidpoint(pts);
          ssZoom = ssClamp(g.z0 * ssDistance(pts) / g.dist0, 1, SS_MAX_ZOOM);
          ssPanX = m.x - window.innerWidth / 2 - ssZoom * g.u0x;
          ssPanY = m.y - window.innerHeight / 2 - ssZoom * g.u0y;
          ssApplyZoom(false);
        }
      }

      function ssCancelGesture() {
        ssGesture = null;
        ssPointers = {};
        if (ssFrameReq) { cancelAnimationFrame(ssFrameReq); ssFrameReq = 0; }
        if (ssTapTimer) { clearTimeout(ssTapTimer); ssTapTimer = null; }
        ssLastTap = null;
        ssTrack.classList.remove('ss-dragging');
      }

      
      function ssIsControlTarget(e) {
        var t = e.target;
        if (t.closest && t.closest('button, a')) return true;
        if (t.tagName === 'VIDEO') {
          var r = t.getBoundingClientRect();
          if (e.clientY > r.bottom - SS_VIDEO_CONTROLS_PX) return true;
        }
        return false;
      }

      function ssOnDown(e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (ssIsControlTarget(e)) return;
        if (Object.keys(ssPointers).length >= 2) return;
        ssPointers[e.pointerId] = { x: e.clientX, y: e.clientY };
        if (Object.keys(ssPointers).length === 2) { ssBeginPinch(); return; }
        ssStopSettle();
        ssGesture = {
          type: 'pending',
          startX: e.clientX, startY: e.clientY,
          lastX: e.clientX, lastY: e.clientY, lastT: e.timeStamp, startT: e.timeStamp,
          dx: 0, dy: 0, vx: 0, vy: 0,
          panX0: ssPanX, panY0: ssPanY,
          pointerType: e.pointerType
        };
      }

      function ssOnMove(e) {
        var pt = ssPointers[e.pointerId];
        if (!pt) return;
        pt.x = e.clientX;
        pt.y = e.clientY;
        var g = ssGesture;
        if (!g || g.type === 'ignore') return;
        if (g.type === 'pinch') { ssScheduleFrame(); return; }

        g.dx = e.clientX - g.startX;
        g.dy = e.clientY - g.startY;
        if (g.type === 'pending') {
          if (Math.sqrt(g.dx * g.dx + g.dy * g.dy) < SS_SLOP) return;
          try { ssViewport.setPointerCapture(e.pointerId); } catch (err) {   }
          if (ssZoom > 1.01) {
            g.type = 'pan';
          } else if (Math.abs(g.dx) >= Math.abs(g.dy)) {
            g.type = 'slide';
            ssShowNeighbors(true);
            ssTrack.style.transition = 'none';
            ssTrack.classList.add('ss-dragging');
          } else {
            g.type = 'dismiss';
          }
        }
        
        var dt = e.timeStamp - g.lastT;
        if (dt > 0) {
          g.vx = g.vx * 0.6 + ((e.clientX - g.lastX) / dt) * 0.4;
          g.vy = g.vy * 0.6 + ((e.clientY - g.lastY) / dt) * 0.4;
        }
        g.lastX = e.clientX;
        g.lastY = e.clientY;
        g.lastT = e.timeStamp;
        ssScheduleFrame();
      }

      function ssBeginPinch() {
        var el = ssCurrentEl();
        var prev = ssGesture;
        
        if (prev && prev.type === 'slide') {
          ssTrack.classList.remove('ss-dragging');
          ssScheduleSettle(ssSetPosition(true));
        } else if (prev && prev.type === 'dismiss') {
          ssSpringBack();
        }
        if (ssFrameReq) { cancelAnimationFrame(ssFrameReq); ssFrameReq = 0; }
        if (ssTapTimer) { clearTimeout(ssTapTimer); ssTapTimer = null; }
        ssLastTap = null;
        if (!el) { ssGesture = { type: 'ignore' }; return; }
        var pts = ssPoints();
        var m = ssMidpoint(pts);
        ssGesture = {
          type: 'pinch',
          dist0: Math.max(ssDistance(pts), 1),
          z0: ssZoom,
          
          u0x: (m.x - window.innerWidth / 2 - ssPanX) / ssZoom,
          u0y: (m.y - window.innerHeight / 2 - ssPanY) / ssZoom
        };
      }

      function ssEndPinch() {
        var el = ssCurrentEl();
        if (el) {
          if (ssZoom < 1.05) {
            ssZoom = 1; ssPanX = 0; ssPanY = 0;
          } else {
            var c = ssClampPan(el, ssZoom, ssPanX, ssPanY);
            ssPanX = c.x; ssPanY = c.y;
          }
          ssApplyZoom(true);
        }
        
        var rest = ssPoints()[0];
        if (rest && ssZoom > 1) {
          ssGesture = {
            type: 'pan', startX: rest.x, startY: rest.y, lastX: rest.x, lastY: rest.y, lastT: 0,
            dx: 0, dy: 0, vx: 0, vy: 0, panX0: ssPanX, panY0: ssPanY
          };
        } else {
          ssGesture = { type: 'ignore' };
        }
      }

      function ssSpringBack() {
        var item = ssTrack.children[ssIndex];
        if (item) {
          item.style.transition = 'transform 0.25s var(--ease-natural)';
          item.style.transform = '';
          setTimeout(function () { item.style.transition = ''; }, 300);
        }
        ssBackdrop.style.transition = 'opacity 0.25s var(--ease-natural)';
        ssBackdrop.style.opacity = '';
      }

      function ssFinishGesture(e, canceled) {
        var g = ssGesture;
        if (!g) return;
        ssGesture = null;
        ssTrack.classList.remove('ss-dragging');
        if (ssFrameReq) { cancelAnimationFrame(ssFrameReq); ssFrameReq = 0; }

        if (g.type === 'slide') {
          var threshold = ssStridePx() * 0.2;
          if (!canceled && (g.dx < -threshold || g.vx < -SS_SWIPE_VELOCITY) && ssIndex < ssItems.length - 1) {
            ssGoTo(ssIndex + 1, true, g.vx);
          } else if (!canceled && (g.dx > threshold || g.vx > SS_SWIPE_VELOCITY) && ssIndex > 0) {
            ssGoTo(ssIndex - 1, true, g.vx);
          } else {
            ssScheduleSettle(ssSetPosition(true, g.vx));
          }
        } else if (g.type === 'dismiss') {
          var item = ssTrack.children[ssIndex];
          if (!canceled && item && (Math.abs(g.dy) > SS_DISMISS_DIST || Math.abs(g.vy) > SS_DISMISS_VELOCITY)) {
            item.style.transition = 'transform 0.28s var(--ease-natural)';
            item.style.transform = 'translate3d(0, ' + (g.dy >= 0 ? 1 : -1) * window.innerHeight * 0.6 + 'px, 0) scale(0.7)';
            ssClose();
          } else {
            ssSpringBack();
          }
        } else if (g.type === 'pending' && !canceled) {
          ssOnTap(e, g);
        }
      }

      function ssOnUp(e) {
        if (!ssPointers[e.pointerId]) return;
        delete ssPointers[e.pointerId];
        var g = ssGesture;
        if (g && g.type === 'pinch') { ssEndPinch(); return; }
        if (Object.keys(ssPointers).length > 0) return;
        if (g && g.type === 'ignore') { ssGesture = null; return; }
        ssFinishGesture(e, e.type === 'pointercancel');
      }

      

      function ssOnTap(e, g) {
        if (e.timeStamp - g.startT > SS_TAP_MAX_MS) return;
        var last = ssLastTap;
        var isDouble = last &&
          e.timeStamp - last.t < SS_DOUBLE_TAP_MS &&
          Math.abs(e.clientX - last.x) < SS_DOUBLE_TAP_DIST &&
          Math.abs(e.clientY - last.y) < SS_DOUBLE_TAP_DIST;
        if (ssTapTimer) { clearTimeout(ssTapTimer); ssTapTimer = null; }
        if (isDouble) {
          ssLastTap = null;
          ssDoubleTap(e.clientX, e.clientY);
          return;
        }
        ssLastTap = { t: e.timeStamp, x: e.clientX, y: e.clientY };
        
        if (g.pointerType !== 'mouse') ssTapTimer = setTimeout(function () { ssTapTimer = null; ssToggleUI(); }, SS_DOUBLE_TAP_MS - 40);
      }

      function ssDoubleTap(x, y) {
        var el = ssCurrentEl();
        if (!el || el.tagName === 'VIDEO') return;
        ssZoomAbout(x, y, ssZoom > 1.05 ? 1 : SS_TAP_ZOOM);
        ssApplyZoom(true);
      }

      

      ssViewport.addEventListener('pointerdown', ssOnDown);
      ssViewport.addEventListener('pointermove', ssOnMove);
      ssViewport.addEventListener('pointerup', ssOnUp);
      ssViewport.addEventListener('pointercancel', ssOnUp);

      
      ssViewport.addEventListener('wheel', function (e) {
        e.preventDefault();
        var factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
        ssZoomAbout(e.clientX, e.clientY, ssZoom * factor);
        ssApplyZoom(false);
      }, { passive: false });

      
      ssBtnClose.addEventListener('click', function () { ssClose(); });
      ssBtnAutoplay.addEventListener('click', function () {
        if (ssAutoplayTimer) ssStopAutoplay(); else ssStartAutoplay();
      });
      ssBtnPrev.addEventListener('click', function () { ssGoTo(ssIndex - 1, true); });
      ssBtnNext.addEventListener('click', function () { ssGoTo(ssIndex + 1, true); });

      
      
      ssEl.addEventListener('pointermove', function (e) {
        if (e.pointerType === 'mouse') ssShowUI();
      });

      
      document.addEventListener('keydown', function (e) {
        if (!ssIsActive()) return;
        if (!ssCoarseMQ.matches) ssShowUI();
        if (e.key === 'ArrowRight') ssGoTo(ssIndex + 1, true);
        else if (e.key === 'ArrowLeft') ssGoTo(ssIndex - 1, true);
        else if (e.key === 'Escape') ssClose();
      });

      document.addEventListener('fullscreenchange', ssOnFullscreenChange);
      document.addEventListener('webkitfullscreenchange', ssOnFullscreenChange);

      
      window.addEventListener('popstate', function () {
        if (ssIsActive()) { ssHistoryPushed = false; ssClose(true); }
      });

      
      
      window.addEventListener('resize', function () {
        if (!ssIsActive() || window.innerWidth === ssLastWidth) return;
        ssLayout();
        ssResetZoom();
        ssSetPosition(false);
      });

      
      document.querySelectorAll('.photo-card').forEach(function (card, idx) {
        card.addEventListener('mouseenter', function () { ssLastPhotoIdx = idx; });
        card.addEventListener('focus', function () { ssLastPhotoIdx = idx; });
        card.addEventListener('pointerdown', function () { ssLastPhotoIdx = idx; });
      });
      document.querySelectorAll('.video-card').forEach(function (card, idx) {
        card.addEventListener('mouseenter', function () { ssLastVideoIdx = idx; });
        card.addEventListener('focus', function () { ssLastVideoIdx = idx; });
        card.addEventListener('pointerdown', function () { ssLastVideoIdx = idx; });
      });

      
      document.querySelectorAll('.photo-card').forEach(function (card, idx) {
        var meta = card.querySelector('.photo-meta');
        if (!meta) return;
        meta.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          ssOpen('image', idx, card.querySelector('img'));
        });
      });

      
      document.querySelectorAll('.slideshow-link').forEach(function (link) {
        link.addEventListener('click', function (e) {
          e.preventDefault();
          var type = link.getAttribute('data-ss-type');
          var startIdx = type === 'image' ? ssLastPhotoIdx : ssLastVideoIdx;
          ssOpen(type, startIdx);
        });
      });

    })();
  </script>

</body>

</html>
