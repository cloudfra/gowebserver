    html {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px;
      overflow-x: hidden;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
      word-break: break-all;
    }

     
    .listing {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 32px;
    }

    .listing-header {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .listing-header .col-name {
      flex: 1;
      min-width: 0;
    }

    .listing-header .col-size {
      width: 80px;
      text-align: right;
    }

    .listing-header .col-modified {
      width: 110px;
      text-align: right;
      padding-left: 12px;
    }

    .sort-link {
      color: var(--text-secondary);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.12s ease;
    }

    .sort-link:hover {
      color: var(--text);
    }

    .sort-arrow {
      font-size: 0.6rem;
      line-height: 1;
    }

    .entry {
      display: flex;
      align-items: center;
      -webkit-user-select: none;
      user-select: none;
    }

    .entry:nth-child(odd) {
      background-color: var(--bg-secondary);
    }

    .entry:hover {
      background-color: var(--hover-bg);
    }

    .entry .icon-link {
      display: flex;
      align-items: center;
      justify-content: center;
      align-self: stretch;
      width: 48px;
      flex-shrink: 0;
      text-decoration: none;
      color: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0.08);
      transition: background-color 0.15s ease;
    }

    .entry .content-link {
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 0;
      padding: 15px 16px 15px 6px;
      text-decoration: none;
      color: var(--text);
      cursor: pointer;
    }

    .entry .col-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--link);
      font-weight: 500;
    }

    .entry .icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .entry .icon-link:hover .icon {
      transform: scale(1.45);
    }

    .entry .icon svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes folder-open {
      0% {
        transform: rotateX(0);
      }

      50% {
        transform: rotateX(-30deg);
      }

      100% {
        transform: rotateX(-15deg);
      }
    }

    .icon-link:hover .icon-folder .folder-flap {
      transform-origin: 3px 7px;
      animation: folder-open 0.5s ease forwards;
    }

     
    @keyframes dl-cycle {
      0%   { transform: translateY(0); }
      58%  { transform: translateY(7px); }
      59%  { transform: translateY(-14px); }
      100% { transform: translateY(0); }
    }

    @keyframes dl-floor-collapse {
      0%   { transform: scaleX(1); opacity: 1; }
      30%  { transform: scaleX(1); opacity: 1; }
      48%  { transform: scaleX(0.55); opacity: 0.35; }
      57%  { transform: scaleX(0.3); opacity: 0.1; }
      59%  { transform: scaleX(1); opacity: 1; }
      100% { transform: scaleX(1); opacity: 1; }
    }

    .icon-link:hover .icon-download .dl-arrow {
      animation: dl-cycle 1.6s linear infinite;
    }

    .icon-link:hover .icon-download .dl-ground {
      transform-origin: 12px 21px;
      animation: dl-floor-collapse 1.6s linear infinite;
    }

     
    @keyframes line-shimmer {
      0% {
        opacity: 0.3;
        stroke-dashoffset: 8;
      }

      100% {
        opacity: 1;
        stroke-dashoffset: 0;
      }
    }

    .icon-link:hover .icon-text .line1 {
      stroke-dasharray: 8;
      animation: line-shimmer 0.4s ease forwards;
    }

    .icon-link:hover .icon-text .line2 {
      stroke-dasharray: 8;
      animation: line-shimmer 0.4s 0.1s ease forwards;
      opacity: 0.3;
    }

     
    @keyframes stamp-press {
      0% {
        transform: scale(1);
      }

      40% {
        transform: scale(0.9);
      }

      100% {
        transform: scale(1.05);
      }
    }

    .icon-link:hover .icon-pdf .pdf-page {
      transform-origin: center;
      animation: stamp-press 0.4s ease forwards;
    }

     
    @keyframes page-curl {

  <script>
    (function () {
      function formatDuration(seconds) {
        var total = Math.floor(seconds);
        var h = Math.floor(total / 3600);
        var m = Math.floor((total % 3600) / 60);
        var s = total % 60;
        return h > 0
          ? h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0')
          : m + ':' + String(s).padStart(2, '0');
      }

      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          var card = entry.target;
          observer.unobserve(card);
          var video = card.querySelector('video');
          if (!video) return;
          video.addEventListener('loadedmetadata', function () {
            var span = card.querySelector('.video-duration');
            if (span) span.textContent = formatDuration(video.duration);
          });
          video.preload = 'metadata';
        });
      }, { rootMargin: '200px' });

      document.querySelectorAll('.video-card').forEach(function (card) {
        observer.observe(card);
      });

    })();

    
    (function () {
      var ssEl = document.getElementById('ss-overlay');
      var ssTrack = document.getElementById('ss-track');
      var ssBtnClose = document.getElementById('ss-close');
      var ssBtnAutoplay = document.getElementById('ss-autoplay');
      var ssBtnPrev = document.getElementById('ss-prev');
      var ssBtnNext = document.getElementById('ss-next');
      if (!ssEl) return;

      
      var ssItems = [];
      var ssIndex = 0;
      
      var ssDragging = false;
      var ssDragStartX = 0;
      var ssDragX = 0;
      var ssVelocity = 0;
      var ssLastX = 0;
      var ssLastY = 0;
      var ssLastTime = 0;
      
      var ssPinching = false;
      var ssPinchDist0 = 0;
      var ssPinchZoom0 = 1;
      
      var ssZoom = 1;
      var ssPanX = 0;
      var ssPanY = 0;
      
      var ssLastPhotoIdx = 0;
      var ssLastVideoIdx = 0;
      
      var ssSettleTimer = null;
      
      var ssAutoplayTimer = null;
      var SS_AUTOPLAY_INTERVAL = 3000;
      
      var ssIdleTimer = null;
      var SS_IDLE_DELAY = 3000;

      
      
      
      

      var SS_ITEM_VW = 0.82;
      var SS_GAP_PX = 12;

      function ssStridePx() {
        return window.innerWidth * SS_ITEM_VW + SS_GAP_PX;
      }

      function ssTrackX(index) {
        
        return window.innerWidth * (1 - SS_ITEM_VW) / 2 - index * ssStridePx();
      }

      
      function ssInitOpacities() {
        Array.from(ssTrack.children).forEach(function (item, i) {
          item.style.transition = 'none';
          item.style.opacity = i === ssIndex ? '1' : '0';
        });
      }

      
      function ssUpdateOpacities() {
        Array.from(ssTrack.children).forEach(function (item, i) {
          item.style.transition = 'opacity 0.25s ease';
          item.style.opacity = i === ssIndex ? '1' : '0';
        });
      }

      
      function ssShowNeighbors() {
        Array.from(ssTrack.children).forEach(function (item, i) {
          item.style.transition = 'opacity 0.25s ease';
          item.style.opacity = Math.abs(i - ssIndex) <= 1 ? '1' : '0';
        });
      }

      
      function ssScheduleSettle() {
        if (ssSettleTimer) clearTimeout(ssSettleTimer);
        ssSettleTimer = setTimeout(ssUpdateOpacities, 400);
      }

      

      function ssAutoplayTick() {
        ssGoTo(ssIndex >= ssItems.length - 1 ? 0 : ssIndex + 1, true);
      }

      function ssStartAutoplay() {
        if (ssAutoplayTimer) clearInterval(ssAutoplayTimer);
        ssAutoplayTimer = setInterval(ssAutoplayTick, SS_AUTOPLAY_INTERVAL);
        ssBtnAutoplay.setAttribute('aria-pressed', 'true');
        ssBtnAutoplay.classList.add('ss-autoplay-active');
        ssBtnAutoplay.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="9" y1="5" x2="9" y2="19"/><line x1="15" y1="5" x2="15" y2="19"/></svg>';
      }

      function ssStopAutoplay() {
        if (ssAutoplayTimer) { clearInterval(ssAutoplayTimer); ssAutoplayTimer = null; }
        ssBtnAutoplay.setAttribute('aria-pressed', 'false');
        ssBtnAutoplay.classList.remove('ss-autoplay-active');
        ssBtnAutoplay.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
      }

      function ssRestartAutoplay() {
        if (ssAutoplayTimer) {
          clearInterval(ssAutoplayTimer);
          ssAutoplayTimer = setInterval(ssAutoplayTick, SS_AUTOPLAY_INTERVAL);
        }
      }

      

      function ssShowUI() {
        ssEl.classList.remove('ss-ui-hidden');
        if (ssIdleTimer) clearTimeout(ssIdleTimer);
        ssIdleTimer = setTimeout(function () {
          ssIdleTimer = null;
          ssEl.classList.add('ss-ui-hidden');
        }, SS_IDLE_DELAY);
      }

      function ssStopIdle() {
        if (ssIdleTimer) { clearTimeout(ssIdleTimer); ssIdleTimer = null; }
        ssEl.classList.remove('ss-ui-hidden');
      }

      

      function ssCurrentEl() {
        var item = ssTrack.children[ssIndex];
        return item ? (item.querySelector('img') || item.querySelector('video')) : null;
      }

      function ssApplyZoom() {
        var el = ssCurrentEl();
        if (!el) return;
        
        el.style.transform = (ssZoom === 1 && ssPanX === 0 && ssPanY === 0)
          ? ''
          : 'scale(' + ssZoom + ') translate(' + (ssPanX / ssZoom) + 'px, ' + (ssPanY / ssZoom) + 'px)';
      }

      function ssResetZoom() {
        ssZoom = 1;
        ssPanX = 0;
        ssPanY = 0;
        var el = ssCurrentEl();
        if (el) el.style.transform = '';
      }

      function ssPinchDistFn(e) {
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }

      

      function ssBuildItems(type) {
        ssItems = [];
        if (type === 'image') {
          document.querySelectorAll('.photo-card').forEach(function (card) {
            var img = card.querySelector('img');
            var nameEl = card.querySelector('.photo-name');
            if (img && nameEl) {
              ssItems.push({ src: img.getAttribute('src'), name: nameEl.textContent, isVideo: false });
            }
          });
        } else {
          document.querySelectorAll('.video-card').forEach(function (card) {
            var srcEl = card.querySelector('source');
            var nameEl = card.querySelector('.video-name');
            if (srcEl && nameEl) {
              ssItems.push({ src: srcEl.getAttribute('src'), name: nameEl.textContent, isVideo: true });
            }
          });
        }
      }

      function ssBuildTrack() {
        ssTrack.innerHTML = '';
        ssItems.forEach(function (item) {
          var div = document.createElement('div');
          div.className = 'ss-item';
          if (item.isVideo) {
            var video = document.createElement('video');
            video.src = item.src;
            video.controls = true;
            video.preload = 'metadata';
            div.appendChild(video);
          } else {
            var img = document.createElement('img');
            img.src = item.src;
            img.alt = item.name;
            img.draggable = false;
            div.appendChild(img);
          }
          ssTrack.appendChild(div);
        });
      }

      

      function ssSetPosition(animate) {
        ssTrack.style.transition = animate
          ? 'transform 0.33s cubic-bezier(0.25, 0.46, 0.45, 0.94)'
          : 'none';
        ssTrack.style.transform = 'translateX(' + ssTrackX(ssIndex) + 'px)';
      }

      function ssUpdateUI() {
        ssBtnPrev.disabled = ssIndex <= 0;
        ssBtnNext.disabled = ssIndex >= ssItems.length - 1;
      }

      function ssGoTo(idx, animate) {
        ssResetZoom();
        var prevItem = ssTrack.children[ssIndex];
        if (prevItem) {
          var v = prevItem.querySelector('video');
          if (v) v.pause();
        }
        ssIndex = Math.max(0, Math.min(idx, ssItems.length - 1));
        ssShowNeighbors();
        ssSetPosition(animate !== false);
        ssUpdateUI();
        ssScheduleSettle();
        ssRestartAutoplay();
      }

      function ssOpen(type, startIdx, originEl) {
        ssBuildItems(type);
        if (ssItems.length === 0) return;
        ssBuildTrack();
        ssResetZoom();
        ssIndex = Math.max(0, Math.min(startIdx || 0, ssItems.length - 1));
        ssSetPosition(false);
        ssUpdateUI();

        var currentItem = ssTrack.children[ssIndex];

        if (originEl && currentItem) {
          var rect = originEl.getBoundingClientRect();
          var vw = window.innerWidth;
          var vh = window.innerHeight;
          var dx = (rect.left + rect.width / 2) - vw / 2;
          var dy = (rect.top + rect.height / 2) - vh / 2;
          var scale = Math.min(rect.width / (vw * SS_ITEM_VW), rect.height / vh);

          
          ssInitOpacities();
          currentItem.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + scale + ')';

          ssEl.classList.add('ss-active');

          
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              currentItem.style.transition = 'transform 0.38s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
              currentItem.style.transform = '';
              currentItem.addEventListener('transitionend', function handler(e) {
                if (e.propertyName !== 'transform') return;
                currentItem.removeEventListener('transitionend', handler);
                currentItem.style.transition = '';
              });
            });
          });
        } else {
          ssInitOpacities();
          ssEl.classList.add('ss-active');
        }

        document.body.style.overflow = 'hidden';
        ssBtnClose.focus();
        ssShowUI();
      }

      function ssClose() {
        ssEl.classList.remove('ss-active');
        document.body.style.overflow = '';
        ssResetZoom();
        ssTrack.querySelectorAll('video').forEach(function (v) { v.pause(); });
        ssStopAutoplay();
        ssStopIdle();
      }

      

      function ssGetX(e) { return e.touches ? e.touches[0].clientX : e.clientX; }
      function ssGetY(e) { return e.touches ? e.touches[0].clientY : e.clientY; }

      function ssOnStart(e) {
        if (e.target.tagName === 'VIDEO' || e.target.tagName === 'BUTTON') return;
        
        if (e.touches && e.touches.length === 2) {
          ssPinching = true;
          ssDragging = false;
          ssPinchDist0 = ssPinchDistFn(e);
          ssPinchZoom0 = ssZoom;
          ssTrack.style.transition = 'none';
          e.preventDefault();
          return;
        }
        if (ssZoom <= 1) {
          if (ssSettleTimer) { clearTimeout(ssSettleTimer); ssSettleTimer = null; }
          ssShowNeighbors();
        }
        ssDragging = true;
        ssDragStartX = ssGetX(e);
        ssDragX = ssDragStartX;
        ssLastX = ssDragStartX;
        ssLastY = ssGetY(e);
        ssLastTime = Date.now();
        ssVelocity = 0;
        ssTrack.style.transition = 'none';
        ssTrack.classList.add('ss-dragging');
        e.preventDefault();
      }

      function ssOnMove(e) {
        
        if (e.touches && e.touches.length === 2 && ssPinching) {
          ssZoom = Math.max(1, Math.min(6, ssPinchZoom0 * (ssPinchDistFn(e) / ssPinchDist0)));
          if (ssZoom === 1) { ssPanX = 0; ssPanY = 0; }
          ssApplyZoom();
          e.preventDefault();
          return;
        }
        if (!ssDragging) return;
        var x = ssGetX(e);
        var y = ssGetY(e);
        var now = Date.now();
        var dt = now - ssLastTime;
        
        if (ssZoom > 1) {
          ssPanX += x - ssLastX;
          ssPanY += y - ssLastY;
          ssLastX = x;
          ssLastY = y;
          ssLastTime = now;
          ssApplyZoom();
          e.preventDefault();
          return;
        }
        
        if (dt > 0) ssVelocity = (x - ssLastX) / dt;
        ssLastX = x;
        ssLastY = y;
        ssLastTime = now;
        ssDragX = x;
        ssTrack.style.transform = 'translateX(' + (ssTrackX(ssIndex) + (ssDragX - ssDragStartX)) + 'px)';
        e.preventDefault();
      }

      function ssOnEnd() {
        ssPinching = false;
        if (!ssDragging) return;
        ssDragging = false;
        ssTrack.classList.remove('ss-dragging');
        
        if (ssZoom > 1) return;
        var delta = ssDragX - ssDragStartX;
        var threshold = ssStridePx() * 0.2;
        var vt = 0.35;
        if ((delta < -threshold || ssVelocity < -vt) && ssIndex < ssItems.length - 1) {
          ssGoTo(ssIndex + 1, true);
        } else if ((delta > threshold || ssVelocity > vt) && ssIndex > 0) {
          ssGoTo(ssIndex - 1, true);
        } else {
          ssSetPosition(true);
          ssScheduleSettle();
        }
      }

      

      var ssViewport = ssEl.querySelector('.ss-viewport');

      
      ssViewport.addEventListener('touchstart', ssOnStart, { passive: false });
      ssViewport.addEventListener('touchmove', ssOnMove, { passive: false });
      ssViewport.addEventListener('touchend', ssOnEnd);
      ssViewport.addEventListener('touchcancel', ssOnEnd);

      
      ssViewport.addEventListener('mousedown', ssOnStart);
      window.addEventListener('mousemove', function (e) { if (ssDragging || ssPinching) ssOnMove(e); });
      window.addEventListener('mouseup', function () { if (ssDragging) ssOnEnd(); });

      
      ssViewport.addEventListener('wheel', function (e) {
        e.preventDefault();
        var factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
        ssZoom = Math.max(1, Math.min(6, ssZoom * factor));
        if (ssZoom === 1) { ssPanX = 0; ssPanY = 0; }
        ssApplyZoom();
      }, { passive: false });

      
      ssBtnClose.addEventListener('click', ssClose);
      ssBtnAutoplay.addEventListener('click', function () {
        if (ssAutoplayTimer) ssStopAutoplay(); else ssStartAutoplay();
      });
      ssBtnPrev.addEventListener('click', function () { ssGoTo(ssIndex - 1, true); });
      ssBtnNext.addEventListener('click', function () { ssGoTo(ssIndex + 1, true); });

      
      ssEl.addEventListener('mousemove', ssShowUI);
      ssEl.addEventListener('touchstart', ssShowUI, { passive: true });

      
      document.addEventListener('keydown', function (e) {
        if (!ssEl.classList.contains('ss-active')) return;
        ssShowUI();
        if (e.key === 'ArrowRight') ssGoTo(ssIndex + 1, true);
        else if (e.key === 'ArrowLeft') ssGoTo(ssIndex - 1, true);
        else if (e.key === 'Escape') ssClose();
      });

      
      document.querySelectorAll('.photo-card').forEach(function (card, idx) {
        card.addEventListener('mouseenter', function () { ssLastPhotoIdx = idx; });
        card.addEventListener('focus', function () { ssLastPhotoIdx = idx; });
      });
      document.querySelectorAll('.video-card').forEach(function (card, idx) {
        card.addEventListener('mouseenter', function () { ssLastVideoIdx = idx; });
        card.addEventListener('focus', function () { ssLastVideoIdx = idx; });
      });

      
      document.querySelectorAll('.photo-card').forEach(function (card, idx) {
        var meta = card.querySelector('.photo-meta');
        if (!meta) return;
        meta.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          ssOpen('image', idx, card.querySelector('img'));
        });
      });

      
      document.querySelectorAll('.slideshow-link').forEach(function (link) {
        link.addEventListener('click', function (e) {
          e.preventDefault();
          var type = link.getAttribute('data-ss-type');
          var startIdx = type === 'image' ? ssLastPhotoIdx : ssLastVideoIdx;
          ssOpen(type, startIdx);
        });
      });

    })();
  </script>

</body>

</html>
