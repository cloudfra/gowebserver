verbose: true
serve:
  - source: /home/folder
    endpoint: /serving
enhancedList: true
http:
  port: 1000
https:
  port: 2000
  certificate:
    rootPrivateKey: root-private-key.pem
    rootPath: root-public-certificate.pem
    privateKey: private-key.pem
    path: public-certificate.pem
    hosts: gowebserver.com
    duration: 24h0m0s
monitoring:
  metrics:
    enabled: true
    path: /prometheus
  trace:
    enabled: true
    uri: remotehost
upload:
  source: /home/upload
  endpoint: /postage
ffmpeg:
  acceptLicense: true
  path: /usr/bin/ffmpeg
  installOnDemand: true
  sourceUrl: https://example.com/ffmpeg.tar.xz
thumbnails:
  enabled: false
  cachePath: /var/cache/gowebserver/thumbnails.db
debug:
  endpoint: /debugging
  shutdown: true
  diagnostics: /var/log/gowebserver-diagnostics.log
