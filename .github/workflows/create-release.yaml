# Builds and publishes a release when a v* tag is pushed: the release
# binaries and package on the GitHub release, and the container images on
# Docker Hub and GitHub Container Registry. The commit was already linted and
# fully tested by deploy.yaml on its way to main, so this runs the tests once
# rather than the whole lint, deflake and coverage pass.
name: Create Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release half-published to the registries is worse than a slow one.
  cancel-in-progress: false

jobs:
  build-release:
    name: "Build Release"
    runs-on: ["self-hosted", "linux", "large"]
    permissions:
      contents: write
      packages: write
    timeout-minutes: 60
    steps:
      - name: Fix mod cache permissions
        run: |
          chmod -R u+w "$GITHUB_WORKSPACE/build/toolchain" 2>/dev/null || true
      - name: Checkout code
        # https://github.com/actions/checkout
        uses: actions/checkout@v7
      - name: Configure Toolchain Cache
        # The same runner tool directory as deploy.yaml, so the release
        # reuses the toolchain CI already installed. See TOOLCHAIN_CACHE in
        # Makefile_core.mk.
        run: |
          echo "TOOLCHAIN_CACHE=$RUNNER_TOOL_CACHE/toolchain" \
            >> "$GITHUB_ENV"
      - name: Setup Go
        # https://github.com/actions/setup-go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Prepare CI
        run: ./scripts/prepare-ci.sh
      - name: System Information
        run: make system-info
      - name: Install Signing Dependencies
        run: ./scripts/template-go/install-codesign.sh
      - name: Clean
        run: make clean
      - name: Build Assets
        run: make assets testassets
      - name: Download Dependencies
        run: make deps
      - name: Install Toolchain
        run: make tools -j"$(nproc)"
      - name: Test
        run: make test
      - name: Build Binaries
        run: make all -j"$(nproc)"
      - name: Release Package
        run: make build/packages/release.tar.gz
      - name: Create Release
        # https://github.com/softprops/action-gh-release
        # The globs pick up every app in ALL_APPS, so the list needs no
        # per-project edits.
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            LICENSE
            build/packages/release.tar.gz
            build/release/*-darwin_arm64
            build/release/*-linux_amd64
            build/release/*-linux_arm64
            build/release/*-windows_amd64.exe
            build/release/*-windows_arm64.exe
      - name: Set up Docker Buildx (Scan)
        # https://github.com/docker/setup-buildx-action
        uses: docker/setup-buildx-action@v4
      - name: Scan Container Image
        # Builds a local single-arch image with --load purely so trivy has
        # something to scan; independent of the multi-arch push below, which
        # never loads images into the local daemon. Never fails the release.
        continue-on-error: true
        run: make scan-images
      - name: Login to GitHub Container Registry
        # https://github.com/docker/login-action#github-packages-docker-registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        # https://github.com/docker/login-action#github-packages-docker-registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Set up QEMU
        # https://github.com/docker/setup-qemu-action
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        # https://github.com/docker/setup-buildx-action
        uses: docker/setup-buildx-action@v4
      - name: Push Images
        run: |
          make DOCKER_PUSH=--push REGISTRY=docker.io/cloudfra images
          make DOCKER_PUSH=--push REGISTRY=ghcr.io/cloudfra images
