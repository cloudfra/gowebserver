# Builds a throwaway release package for the pull request that asked for it:
# started by a '/create-temp-release' comment from a member of the organization
# that owns the repo, or a manual run, and uploaded as an artifact retained for
# 1 day. Unlike create-release.yaml this publishes nothing - no GitHub release
# entry and no container images.
name: Create Temporary Release

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release half-published to the registries is worse than a slow one.
  cancel-in-progress: false

env:
  # Folded for yamllint's 80-column rule: YAML joins these lines with a single
  # space, which is the separator make splits MAKEFLAGS on. The `\ ` keeps
  # RELEASE_PLATFORMS one assignment instead of two.
  MAKEFLAGS: >-
    NICHE_PLATFORMS=
    LINUX_PLATFORMS=linux/amd64
    WINDOWS_PLATFORMS=windows/amd64
    RELEASE_PLATFORMS=linux/amd64\ windows/amd64

jobs:
  build-temp-release:
    # A comment trigger has to be on a pull request, mention the command, and
    # come from someone in the organization that owns the repo: OWNER and
    # MEMBER are org roles, COLLABORATOR is an outside collaborator. The job
    # compiles that pull request's own code on a self-hosted runner.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.issue.pull_request
      && contains(github.event.comment.body, '/create-temp-release')
      && contains(fromJSON('["OWNER", "MEMBER"]'),
      github.event.comment.author_association))
    name: "Build Temporary Release"
    runs-on: ["self-hosted", "linux"]
    timeout-minutes: 30
    steps:
      - name: Fix mod cache permissions
        run: |
          chmod -R u+w "$GITHUB_WORKSPACE/build/toolchain" 2>/dev/null || true
      - name: Checkout code
        # https://github.com/actions/checkout
        uses: actions/checkout@v7
        with:
          # An issue_comment event is resolved against the default branch, so
          # github.ref here is main; refs/pull/<n>/head is the pull request
          # whose comment started the run.
          ref: >-
            ${{ github.event_name == 'issue_comment'
            && format('refs/pull/{0}/head', github.event.issue.number)
            || github.ref }}
      - name: Configure Toolchain Cache
        # The same runner tool directory as deploy.yaml, so the release
        # reuses the toolchain CI already installed. See TOOLCHAIN_CACHE in
        # Makefile_core.mk.
        run: |
          echo "TOOLCHAIN_CACHE=$RUNNER_TOOL_CACHE/toolchain" \
            >> "$GITHUB_ENV"
      - name: Setup Go
        # https://github.com/actions/setup-go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Prepare CI
        run: ./scripts/prepare-ci.sh
      - name: System Information
        run: make system-info
      - name: Install Signing Dependencies
        run: ./scripts/template-go/install-codesign.sh
      - name: Clean
        run: make clean
      - name: Download Dependencies
        run: make deps
      - name: Build Binaries
        run: make all -j"$(nproc)"
      - name: Release Package
        run: make build/packages/release.tar.gz
      - name: 'Upload Build Artifact'
        uses: actions/upload-artifact@v7
        with:
          name: release.tar.gz
          path: build/packages/release.tar.gz
          retention-days: 1
          archive: false
          if-no-files-found: error
