# Builds and publishes a temporary 1 day retained release on demand.
name: Create Temporary Release

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release half-published to the registries is worse than a slow one.
  cancel-in-progress: false

env:
  MAKEFLAGS: 'NICHE_PLATFORMS= LINUX_PLATFORMS=linux/amd64 WINDOWS_PLATFORMS=windows/amd64 RELEASE_PLATFORMS=linux/amd64\ windows/amd64'

jobs:
  build-temp-release:
    # Only run if the comment is on a PR and matches our command keyword
    if: >-
      (github.event.issue.pull_request && contains(github.event.comment.body, '/create-temp-release')) ||
      (github.event_name == 'workflow_dispatch')
    name: "Build Temporary Release"
    runs-on: ["self-hosted", "linux"]
    timeout-minutes: 30
    steps:
      - name: Fix mod cache permissions
        run: |
          chmod -R u+w "$GITHUB_WORKSPACE/build/toolchain" 2>/dev/null || true
      - name: Checkout code
        # https://github.com/actions/checkout
        uses: actions/checkout@v7
      - name: Configure Toolchain Cache
        # The same runner tool directory as deploy.yaml, so the release
        # reuses the toolchain CI already installed. See TOOLCHAIN_CACHE in
        # Makefile_core.mk.
        run: |
          echo "TOOLCHAIN_CACHE=$RUNNER_TOOL_CACHE/toolchain" \
            >> "$GITHUB_ENV"
      - name: Setup Go
        # https://github.com/actions/setup-go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Prepare CI
        run: ./scripts/prepare-ci.sh
      - name: System Information
        run: make system-info
      - name: Install Signing Dependencies
        run: ./scripts/template-go/install-codesign.sh
      - name: Clean
        run: make clean
      - name: Download Dependencies
        run: make deps
      - name: Build Binaries
        run: make all -j"$(nproc)"
      - name: Release Package
        run: make build/packages/release.tar.gz
      - name: 'Upload Build Artifact'
        uses: actions/upload-artifact@v7
        with:
          name: release.tar.gz
          path: build/packages/release.tar.gz
          retention-days: 1
          archive: false
          if-no-files-found: error
