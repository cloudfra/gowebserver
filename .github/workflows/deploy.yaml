name: CI

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # On pull requests, skip the niche platforms (NICHE_PLATFORMS= is an empty
  # list) and only build amd64 and arm64 for Linux and Windows to keep CI fast.
  # This goes through MAKEFLAGS because make treats it like a command-line
  # variable, which overrides the assignment in the Makefile; a plain
  # NICHE_PLATFORMS environment variable would not. Spaces inside a value must
  # be escaped with a backslash or make splits the list into separate words.
  MAKEFLAGS: ${{ github.event_name == 'pull_request' && 'GO_TEST_COUNT=3 NICHE_PLATFORMS= LINUX_PLATFORMS=linux/amd64\ linux/arm64 WINDOWS_PLATFORMS=windows/amd64\ windows/arm64' || '' }}

jobs:
  build-linux:
    name: "Build Linux"
    runs-on: ["self-hosted", "linux", "large"]
    permissions:
      contents: write
      packages: write
      checks: write
      # Required by actions/upload-code-coverage below.
      # https://docs.github.com/en/code-security/how-tos/maintain-quality-code/set-up-code-coverage
      code-quality: write
    timeout-minutes: 20
    steps:
      - name: Fix mod cache permissions
        run: |
          chmod -R u+w "$GITHUB_WORKSPACE/build/toolchain" 2>/dev/null || true
      - name: Checkout code
        # https://github.com/actions/checkout
        uses: actions/checkout@v7
      - name: Setup Go
        # https://github.com/actions/setup-go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: System Information
        run: make system-info
      # - name: Container Fix
      #   run: git config --system --add safe.directory /__w/

      - name: Install Signing Dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y -q install osslsigncode binutils openssl
      - name: Install Prerequisites
        run: |
          sudo apt-get update
          sudo apt -y -q install software-properties-common
          sudo add-apt-repository universe
          sudo apt-get update
          sudo apt-get -y -q install lz4 p7zip-full rar unrar

      - name: Clean
        run: make clean
      - name: Build Assets
        run: make assets testassets
      - name: Download Dependencies
        run: make deps
      - name: Install Toolchain
        run: make tools -j"$(nproc)"
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Test (Deflake)
        run: make test-deflake
      - name: Coverage
        run: make coverage.txt coverage.xml
      - name: Push Code Coverage
        # https://github.com/codecov/codecov-action
        uses: codecov/codecov-action@v7
        with:
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          flags: unittests
          # Ignore upload errors since authz token is required for codecov.
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
          verbose: true
      - name: Upload Coverage Report
        # https://github.com/actions/upload-code-coverage
        # https://docs.github.com/en/code-security/how-tos/maintain-quality-code/set-up-code-coverage#step-2-upload-the-coverage-report
        # Requires: code-quality: write
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Go
          label: code-coverage/gotest

      - name: Benchmark
        # Benchmarks are for performance tracking, not PR correctness.
        if: ${{ github.event_name != 'pull_request' }}
        run: make benchmark.html
      - name: Publish Benchmark (7 Days)
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: benchmark-linux.html
          path: |
            benchmark.html
          retention-days: 7
          if-no-files-found: error

      - name: Build Binaries
        run: make all -j"$(nproc)"

      - name: Set up Docker Buildx (Scan)
        # https://github.com/docker/setup-buildx-action
        # Skipped on pull requests along with the image scan below.
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/setup-buildx-action@v4

      - name: Scan Container Image
        # Builds a local single-arch image with --load purely so trivy has
        # something to scan; independent of the multi-arch push pipeline
        # further down, which never loads images into the local daemon.
        # Skipped on pull requests, and never fails the build.
        if: ${{ github.event_name != 'pull_request' }}
        continue-on-error: true
        run: make scan-images

      - name: Release Package
        if: ${{ github.event_name != 'pull_request' }}
        run: make build/packages/release.tar.gz

      - name: Upload Release Binaries
        # For publish-track, which publishes them to a release track.
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: build/release/
          retention-days: 1
          if-no-files-found: error

      - name: Create Release
        # https://github.com/softprops/action-gh-release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            LICENSE
            build/packages/release.tar.gz
            build/release/gowebserver-darwin_arm64
            build/release/gowebserver-linux_amd64
            build/release/gowebserver-linux_arm64
            build/release/gowebserver-windows_amd64.exe
            build/release/gowebserver-windows_arm64.exe

      - name: Login to GitHub Container Registry
        # https://github.com/docker/login-action#github-packages-docker-registry
        uses: docker/login-action@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        # https://github.com/docker/login-action#github-packages-docker-registry
        uses: docker/login-action@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        # https://github.com/docker/setup-qemu-action
        uses: docker/setup-qemu-action@v4
        if: ${{ github.event_name != 'pull_request' }}

      - name: Set up Docker Buildx
        # https://github.com/docker/setup-buildx-action
        uses: docker/setup-buildx-action@v4
        if: ${{ github.event_name != 'pull_request' }}

      - name: Push Images (Commit)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' }}
        run: |
          make DOCKER_PUSH="" REGISTRY=docker.io/cloudfra linux-images windows-images

      - name: Push Images (Release)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          make DOCKER_PUSH=--push REGISTRY=docker.io/cloudfra images
          make DOCKER_PUSH=--push REGISTRY=ghcr.io/cloudfra images

  publish-track:
    name: "Publish Release Track"
    # Automatic updates (pkg/update) read tracks.json from the "unstable"
    # release. A push to main makes its build the unstable track, replacing
    # that release's binaries; a release tag makes its build the stable
    # track, whose binaries are the tag's own release.
    if: ${{ github.event_name == 'push' }}
    needs: build-linux
    runs-on: ["self-hosted", "linux", "large"]
    permissions:
      contents: write
    # tracks.json is read, changed and uploaded again, so a main push and a
    # tag push must not interleave; each waits for the other.
    concurrency:
      group: publish-track
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # git describe needs the tags and history.
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Download Release Binaries
        uses: actions/download-artifact@v7
        with:
          name: release-binaries
          path: build/release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(git describe --tags)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            track=stable
            base_url="$REPO_URL/releases/download/$GITHUB_REF_NAME/"
          else
            track=unstable
            base_url="$REPO_URL/releases/download/unstable/"
          fi
          if ! gh release view unstable >/dev/null 2>&1; then
            gh release create unstable --prerelease --latest=false --target "$GITHUB_SHA" --title "Unstable" \
              --notes "The latest build of main, replaced on every merge. tracks.json lists the current stable and unstable builds for automatic updates."
          fi
          # Missing on the very first run; the tool then starts a new one.
          gh release download unstable --pattern tracks.json --dir . --clobber || true
          go run ./internal/tools/tracks -manifest tracks.json -track "$track" \
            -version "$version" -commit "$GITHUB_SHA" -base-url "$base_url" -dir build/release
          if [[ "$track" == unstable ]]; then
            git tag -f unstable "$GITHUB_SHA"
            git push -f origin refs/tags/unstable
            gh release upload unstable build/release/gowebserver-* --clobber
          fi
          # Last, so it never points at binaries that aren't there yet.
          gh release upload unstable tracks.json --clobber

  build-windows:
    name: "Build Windows"
    runs-on: ["self-hosted", "windows", "large"]
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: System Information
        run: make system-info
      - name: Clean
        run: make clean
      - name: Build Assets
        run: make assets testassets
      - name: Download Dependencies
        run: make deps
      - name: Install Toolchain
        run: make tools -j"$(nproc)"
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Test (Deflake)
        run: make GO_TEST_COUNT=${{ github.event_name == 'pull_request' && '3' || '5' }} test-deflake
      - name: Coverage
        run: make coverage.txt coverage.xml

      - name: Benchmark
        # Benchmarks are for performance tracking, not PR correctness.
        if: ${{ github.event_name != 'pull_request' }}
        run: make benchmark.html
      - name: Publish Benchmark (7 Days)
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: benchmark-windows.html
          path: |
            benchmark.html
          retention-days: 7
          if-no-files-found: error
      - name: Clean
        # Leave the workspace clean for the next run. This is what keeps
        # `actions/checkout`'s `git clean -ffdx` fast on the Windows
        # self-hosted runner: without it, a previous build leaves the read-only
        # Go toolchain/module cache under build/ and the next checkout's
        # `git clean -ffdx` must delete those read-only files (hundreds of
        # "access denied", over a minute). `make clean` handles them with
        # `-chmod -R +w build/` before `rm -rf build/`. `if: always()` makes it
        # run even when an earlier step failed, so a failed build still leaves
        # a clean workspace instead of poisoning the next checkout.
        if: always()
        run: make clean
