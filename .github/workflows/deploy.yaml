name: CI

# Releases are built and published by create-release.yaml, on a tag push.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # On pull requests, skip the niche platforms (NICHE_PLATFORMS= is an empty
  # list) and only build amd64 and arm64 for Linux and Windows to keep CI fast.
  # This goes through MAKEFLAGS because make treats it like a command-line
  # variable, which overrides the assignment in the Makefile; a plain
  # NICHE_PLATFORMS environment variable would not. Spaces inside a value must
  # be escaped with a backslash or make splits the list into separate words.
  MAKEFLAGS: >-
    ${{ github.event_name == 'pull_request'
    && 'GO_TEST_COUNT=3 NICHE_PLATFORMS=
    LINUX_PLATFORMS=linux/amd64\ linux/arm64
    WINDOWS_PLATFORMS=windows/amd64\ windows/arm64'
    || '' }}

jobs:
  build-linux:
    name: "Build Linux"
    runs-on: ["self-hosted", "linux", "large"]
    permissions:
      contents: read
      checks: write
    timeout-minutes: 20
    steps:
      - name: Fix mod cache permissions
        run: |
          chmod -R u+w "$GITHUB_WORKSPACE/build/toolchain" 2>/dev/null || true
      - name: Checkout code
        # https://github.com/actions/checkout
        uses: actions/checkout@v7
      - name: Configure Toolchain Cache
        # Install toolchain releases into the runner's persistent tool
        # directory instead of build/, so they survive checkout's
        # `git clean -ffdx` and the Clean step below and are installed once
        # per runner. Projects made from template-go share it, and only
        # install the versions they pin that are not there yet. See
        # TOOLCHAIN_CACHE in Makefile_core.mk.
        run: |
          echo "TOOLCHAIN_CACHE=$RUNNER_TOOL_CACHE/toolchain" \
            >> "$GITHUB_ENV"
      - name: Setup Go
        # https://github.com/actions/setup-go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Prepare CI
        run: ./scripts/prepare-ci.sh
      - name: System Information
        run: make system-info
      # - name: Container Fix
      #   run: git config --system --add safe.directory /__w/
      - name: Install Signing Dependencies
        run: ./scripts/template-go/install-codesign.sh
      - name: Clean
        run: make clean
      - name: Build Assets
        run: make assets testassets
      - name: Download Dependencies
        run: make deps
      - name: Install Toolchain
        run: make tools -j"$(nproc)"
      - name: Lint
        # The only lint step in the workflow: make lint-go runs once per GOOS
        # in LINT_GOOS, so source gated to another platform is checked here
        # and the Windows job needs no lint pass of its own.
        run: make lint
      - name: Test
        run: make test
      - name: Test (Deflake)
        run: make test-deflake
      - name: Coverage
        # Coverage numbers are only tracked for the default branch, and this
        # is a second race-instrumented pass over every package, so a pull
        # request does not pay for it.
        if: ${{ github.event_name != 'pull_request' }}
        run: make coverage.txt
      - name: Push Code Coverage
        # https://github.com/codecov/codecov-action
        if: ${{ github.event_name != 'pull_request' }}
        uses: codecov/codecov-action@v7
        with:
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          flags: unittests
          fail_ci_if_error: true
          verbose: true
      - name: Benchmark
        # Benchmarks are for performance tracking, not PR correctness.
        if: ${{ github.event_name != 'pull_request' }}
        run: make benchmark.html
      - name: Publish Benchmark (7 Days)
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: benchmark-linux.html
          path: |
            benchmark.html
          retention-days: 7
          if-no-files-found: error
      - name: Build Binaries
        run: make all -j"$(nproc)"

  build-windows:
    name: "Build Windows"
    runs-on: ["self-hosted", "windows", "large"]
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Toolchain Cache
        # Same as the Linux job. make treats the colon in a C:\ path as a
        # rule separator, so the path is converted to MSYS form (/c/...).
        shell: bash
        run: |
          cache="$(cygpath -u "$RUNNER_TOOL_CACHE")/toolchain"
          echo "TOOLCHAIN_CACHE=$cache" >> "$GITHUB_ENV"
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Initialize CI
        shell: powershell
        run: ./scripts/Initialize-CI.ps1
      - name: System Information
        run: make system-info
      - name: Clean
        run: make clean
      - name: Build Assets
        run: make assets testassets
      - name: Download Dependencies
        run: make deps
      - name: Install Toolchain
        run: make tools -j"$(nproc)"
      - name: Test
        run: make test
      - name: Test (Deflake)
        run: >-
          make GO_TEST_COUNT=${{ github.event_name == 'pull_request'
          && '3' || '5' }} test-deflake
      - name: Coverage
        # Same as the Linux job: coverage is tracked on the default branch
        # only, so a pull request skips this second race-instrumented pass.
        if: ${{ github.event_name != 'pull_request' }}
        run: make coverage.txt
      - name: Benchmark
        # Benchmarks are for performance tracking, not PR correctness.
        if: ${{ github.event_name != 'pull_request' }}
        run: make benchmark.html
      - name: Publish Benchmark (7 Days)
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: benchmark-windows.html
          path: |
            benchmark.html
          retention-days: 7
          if-no-files-found: error
      - name: Clean
        # Leave the workspace clean for the next run. This is what keeps
        # `actions/checkout`'s `git clean -ffdx` fast on the Windows
        # self-hosted runner: without it, a previous build leaves the read-only
        # Go toolchain/module cache under build/ and the next checkout's
        # `git clean -ffdx` must delete those read-only files (hundreds of
        # "access denied", over a minute). `make clean` handles them with
        # `-chmod -R +w build/` before `rm -rf build/`. `if: always()` makes it
        # run even when an earlier step failed, so a failed build still leaves
        # a clean workspace instead of poisoning the next checkout.
        if: always()
        run: make clean
