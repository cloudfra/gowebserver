# Builds the Windows release binaries and has SignPath sign them, for
# create-release.yaml and create-temp-release.yaml to publish. The signed
# binaries come back as the `windows-signed` artifact, a zip of the .exe
# files, which the caller unpacks into WINDOWS_SIGNED_DIR (see
# Makefile_build.mk).
#
# SignPath's open source program only signs what GitHub-hosted runners built,
# so both jobs run on ubuntu-latest, never on the self-hosted runners. The
# build job runs the code being released without any secret; the signing job
# holds the API token but never checks out or runs that code.
#
# Repository (or organization) settings it reads:
#   vars.SIGNPATH_ORGANIZATION_ID   SignPath organization ID
#   vars.SIGNPATH_PROJECT_SLUG      SignPath project slug (default: repo name)
#   secrets.SIGNPATH_API_TOKEN      a SignPath CI user's token (submitter)
# See "Code signing" in README.md.
name: Sign Windows Binaries

on:
  workflow_call:
    inputs:
      ref:
        description: The commit, branch or tag to build.
        type: string
        required: true
      signing-policy:
        description: >-
          SignPath signing policy slug: release-signing (the trusted
          certificate, approved by hand) or test-signing.
        type: string
        default: release-signing
      platforms:
        description: The Windows platforms to build, as WINDOWS_PLATFORMS.
        type: string
        default: windows/amd64 windows/arm64
    secrets:
      SIGNPATH_API_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build-windows:
    name: "Build Windows Binaries"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        # https://github.com/actions/checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # VERSION comes from git describe --tags.
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go
        # https://github.com/actions/setup-go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Version
        id: version
        run: echo "version=$(make -s print-version)" >> "$GITHUB_OUTPUT"
      - name: Build Windows Release Binaries
        # Unsigned, with version information: SignPath signs them.
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          make WINDOWS_SIGNING=none \
            WINDOWS_PLATFORMS="$PLATFORMS" RELEASE_PLATFORMS="$PLATFORMS" \
            windows-release-binaries -j"$(nproc)"
      - name: Upload Unsigned Binaries
        id: upload
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          path: build/release/*.exe
          retention-days: 1
          if-no-files-found: error

  sign-windows:
    name: "Sign Windows Binaries"
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Submit Signing Request
        # https://github.com/signpath/github-action-submit-signing-request
        # Waits for the request to be approved in SignPath (release-signing
        # asks an approver every time) and for the signature.
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: >-
            ${{ vars.SIGNPATH_PROJECT_SLUG
            || github.event.repository.name }}
          signing-policy-slug: ${{ inputs.signing-policy }}
          github-artifact-id: ${{ needs.build-windows.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3000
          output-artifact-directory: build/signed
          # Checked against each binary's product version; see
          # .signpath/artifact-configuration.xml.
          parameters: |
            version: ${{ toJSON(needs.build-windows.outputs.version) }}
      - name: Upload Signed Binaries
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-signed
          path: build/signed/*.exe
          retention-days: 1
          if-no-files-found: error
